name: CI

on:
  push:
    branches: [ main, thread-safety-refactor ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.19'
      - name: Run tests
        run: go test ./...

  race:
    name: go test -race
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.19'
      - name: Run race detector
        run: go test -race ./...
